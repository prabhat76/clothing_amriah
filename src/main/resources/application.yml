spring:
  application:
    name: clothing-ai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cache:
    type: caffeine
    cache-names: products,categories,recommendations,ai-cache
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
  forward-headers-strategy: framework
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  show-actuator: false
  packages-to-scan: com.clothing.ai

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_super_secret_key_that_is_at_least_256_bits_long_for_HS256_algorithm_use}
    access-token-expiration: 3600000      # 1 hour
    refresh-token-expiration: 2592000000  # 30 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
    enabled: ${AI_ENABLED:true}
    cache-ttl-minutes: 60
  upload:
    base-dir: ${UPLOAD_DIR:./uploads}
    public-url: ${PUBLIC_URL:http://localhost:8080}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}
  notifications:
    email:
      from: ${MAIL_FROM:noreply@clothingai.com}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      currency: USD

logging:
  level:
    root: INFO
    com.clothing.ai: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
